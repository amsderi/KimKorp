<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Private Page</title>
<style>
@font-face{font-family:'Orbitron';font-weight:400;font-style:normal;src:local('Orbitron'),local('Orbitron Regular')}
@font-face{font-family:'Orbitron';font-weight:700;font-style:normal;src:local('Orbitron Bold')}
@font-face{font-family:'Orbitron';font-weight:900;font-style:normal;src:local('Orbitron Black')}
:root{--ff-head:'Orbitron','Consolas','Courier New',monospace;--ff-title:'Bebas Neue','Impact','Arial Narrow',sans-serif;--ff-body:'Rajdhani','Segoe UI','Tahoma','Arial',sans-serif}
:root{--bg:#0a0810;--card:#120f1c;--accent:#e84393;--glow:rgba(232,67,147,0.4);--accent2:#9b2c8e;--gold:#ffd700;--text:#e8e6f0;--muted:#8a8899;--border:rgba(255,255,255,0.06);--grad:linear-gradient(135deg,#e84393,#7b2d8e);--gradd:linear-gradient(180deg,#0a0810 0%,#16102a 100%)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ff-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.hi{max-width:1400px;margin:0 auto;padding:8px 40px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--ff-head);font-size:28px;font-weight:900;letter-spacing:4px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;position:relative}
.logo::after{display:none}
.clan-logo{width:52px;height:52px;margin-left:14px;filter:drop-shadow(0 0 10px rgba(232,67,147,0.4));animation:pulse 2s ease-in-out infinite;flex-shrink:0;object-fit:contain}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.9)}}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav button{font-family:var(--ff-body);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:none;border:none;color:var(--muted);padding:8px 10px;cursor:pointer;position:relative;transition:color .3s}
nav button:hover,nav button.active{color:var(--accent)}
nav button.active::after{content:'';position:absolute;bottom:0;left:10px;right:10px;height:2px;background:var(--grad);border-radius:1px;box-shadow:0 0 10px var(--glow)}
.atgl{background:var(--grad)!important;color:#fff!important;border-radius:3px!important;padding:8px 16px!important;font-size:12px!important;margin-left:12px;-webkit-text-fill-color:#fff}
.atgl.on{background:rgba(232,67,147,.15)!important;border:1px solid var(--accent)!important;color:var(--accent)!important;-webkit-text-fill-color:var(--accent)}

/* Hero */
.hero{position:relative;height:500px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;margin-top:90px}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(232,67,147,.15),transparent),radial-gradient(ellipse 60% 50% at 70% 60%,rgba(123,45,142,.12),transparent),var(--gradd)}
.hero-lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(232,67,147,.03) 2px,rgba(232,67,147,.03) 4px);animation:scan 8s linear infinite}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
.hero-content{position:relative;z-index:2}
.hero h1{font-family:var(--ff-head);font-size:clamp(48px,8vw,96px);font-weight:900;letter-spacing:12px;line-height:1;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:heroIn 1s ease-out}
.hero .sub{font-family:var(--ff-title);font-size:22px;letter-spacing:10px;color:var(--muted);margin-top:12px;animation:heroIn 1s ease-out .2s both}
.hero .tag{font-size:16px;color:var(--accent);margin-top:20px;font-weight:600;letter-spacing:3px;text-transform:uppercase;animation:heroIn 1s ease-out .4s both}
@keyframes heroIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.dia{position:absolute;width:12px;height:12px;border:2px solid var(--accent);transform:rotate(45deg);opacity:.3}
.dia:nth-child(2){top:20%;left:15%;animation:fl 6s ease-in-out infinite}
.dia:nth-child(3){top:60%;right:12%;animation:fl 8s ease-in-out infinite 1s}
.dia:nth-child(4){bottom:15%;left:25%;width:8px;height:8px;border-color:var(--accent2);animation:fl 7s ease-in-out infinite .5s}
@keyframes fl{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(-15px)}}

/* Layout */
.main{max-width:1400px;margin:0 auto;padding:40px 40px 80px}
.pt{font-family:var(--ff-head);font-size:36px;font-weight:900;letter-spacing:6px;margin-bottom:8px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ps{color:var(--muted);font-size:15px;letter-spacing:3px;text-transform:uppercase;margin-bottom:40px}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.sb{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;text-align:center}
.sb .sv{font-family:var(--ff-head);font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb .sl{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:6px}

/* News */
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:28px}
.nc{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:all .4s;cursor:pointer;position:relative}
.nc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.nc:hover::before{transform:scaleX(1)}.nc:hover{transform:translateY(-4px);border-color:rgba(232,67,147,.2);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.nt{width:100%;height:200px;background:linear-gradient(135deg,#181525,#2a1535);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.nt img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.nt .oi{font-size:60px;opacity:.15}
.nb{padding:24px}
.ntg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:2px;margin-bottom:12px}
.ntg-match{background:rgba(232,67,147,.15);color:var(--accent)}.ntg-roster{background:rgba(155,44,142,.15);color:var(--accent2)}.ntg-event{background:rgba(255,215,0,.15);color:var(--gold)}.ntg-announcement{background:rgba(0,200,150,.15);color:#00c896}
.nb h3{font-family:var(--ff-title);font-size:24px;letter-spacing:2px;margin-bottom:8px;line-height:1.2}
.nb p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:16px}
.nd{font-size:12px;color:var(--muted);letter-spacing:1px;opacity:.7}
a.nc,a.fc{display:block}
a.nc .nb::after,a.fc .fco::after{content:'Read more →';display:block;margin-top:12px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);opacity:.6;transition:opacity .3s}
a.nc:hover .nb::after,a.fc:hover .fco::after{opacity:1}
.feat{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;margin-bottom:40px}
.fc{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;position:relative;cursor:pointer;transition:all .4s}
.fc:hover{border-color:rgba(232,67,147,.3)}
.fi{height:300px;background:linear-gradient(135deg,#150a18,#2a1238,#181525);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.fi img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.fi::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,.9),transparent 60%)}
.fco{position:absolute;bottom:0;left:0;right:0;padding:32px;z-index:2}
.fco h2{font-family:var(--ff-title);font-size:32px;letter-spacing:3px;line-height:1.1;margin-bottom:8px}
.fco p{color:var(--muted);font-size:15px;line-height:1.5}
.fsd{display:flex;flex-direction:column;gap:28px}

/* Matches */
.mfl{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap}
.fb{font-family:var(--ff-body);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 20px;cursor:pointer;border-radius:2px;transition:all .3s}
.fb:hover,.fb.act{background:rgba(232,67,147,.1);border-color:var(--accent);color:var(--accent)}
.ml{display:flex;flex-direction:column;gap:16px}
.mr{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:20px 28px;display:grid;grid-template-columns:140px 1fr auto auto;align-items:center;gap:24px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.mr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.mr.win::before{background:#00c896}.mr.loss::before{background:#ff4444}.mr.draw::before{background:#ffa500}.mr.upcoming::before{background:var(--accent2)}
.mr:hover{border-color:rgba(232,67,147,.2);transform:translateX(4px)}
.md{font-size:13px;color:var(--muted);letter-spacing:1px}
.mt{display:flex;align-items:center;gap:16px;font-family:var(--ff-title);font-size:22px;letter-spacing:2px;flex-wrap:wrap}
.mt .vs{font-size:14px;color:var(--accent);font-family:var(--ff-body);font-weight:700}
.tl{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;overflow:hidden}
.tl img{width:100%;height:100%;object-fit:cover}
.ms{font-family:var(--ff-head);font-size:20px;font-weight:700;letter-spacing:3px}
.ms.ws{color:#00c896}.ms.ls{color:#ff4444}.ms.ds{color:#ffa500}
.mst{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;border-radius:2px}
.sw{background:rgba(0,200,150,.1);color:#00c896}.slo{background:rgba(255,68,68,.1);color:#ff4444}.sd{background:rgba(255,165,0,.1);color:#ffa500}.su{background:rgba(155,44,142,.1);color:var(--accent2)}

/* Match detail */
.mdh{text-align:center;padding:40px 0}
.mu{display:flex;align-items:center;justify-content:center;gap:40px;margin-bottom:24px}
.mut{display:flex;flex-direction:column;align-items:center;gap:12px}
.mut .tlg{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;font-family:var(--ff-head);border:2px solid var(--border);overflow:hidden}
.mut .tlg img{width:100%;height:100%;object-fit:cover}
.mut .tn{font-family:var(--ff-title);font-size:28px;letter-spacing:4px}
.mvs{font-family:var(--ff-head);font-size:36px;font-weight:900;color:var(--accent);text-shadow:0 0 30px var(--glow)}
.bsc{font-family:var(--ff-head);font-size:64px;font-weight:900;letter-spacing:8px;margin:20px 0}
.bsc .scl{color:#00c896}.bsc .scs{color:var(--muted);margin:0 8px}.bsc .scr{color:#ff4444}.bsc .scd{color:#ffa500}
.mm{display:flex;justify-content:center;gap:32px;color:var(--muted);font-size:14px;letter-spacing:1px;flex-wrap:wrap}
.mpr{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:40px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;position:relative;overflow:hidden}
.mc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mc.mw::after{background:#00c896}.mc.mlo::after{background:#ff4444}
.mc h4{font-family:var(--ff-title);font-size:20px;letter-spacing:2px;margin-bottom:4px}
.mc .mn{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
.msb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.msb .ts{font-family:var(--ff-head);font-size:28px;font-weight:700}
.msb .bc{flex:1;height:6px;background:rgba(255,68,68,.3);border-radius:3px;overflow:hidden}
.msb .bf{height:100%;background:#00c896;border-radius:3px;transition:width 1s}
.pbs{margin-top:32px;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:28px}
.pbs h3{font-family:var(--ff-title);font-size:22px;letter-spacing:3px;margin-bottom:20px;color:var(--accent)}
.pbr{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pbi{padding:8px 16px;border-radius:3px;font-size:14px;font-weight:600;letter-spacing:1px}
.pbp{background:rgba(0,200,150,.1);border:1px solid rgba(0,200,150,.3);color:#00c896}
.pbb{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);color:#ff4444;text-decoration:line-through}
.bbk{font-family:var(--ff-body);font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:none;border:1px solid var(--border);color:var(--muted);padding:10px 24px;cursor:pointer;border-radius:2px;transition:all .3s;margin-bottom:32px}
.bbk:hover{border-color:var(--accent);color:var(--accent)}
.oi2{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:28px;margin-top:32px}
.oi2 h3{font-family:var(--ff-title);font-size:22px;letter-spacing:3px;margin-bottom:16px;color:var(--accent2)}
.ost{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.os{text-align:center;padding:16px;background:rgba(255,255,255,.02);border-radius:4px}
.os .v{font-family:var(--ff-head);font-size:24px;font-weight:700;color:var(--accent)}
.os .l{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}

/* Contact */
.tsec{margin-bottom:60px}
.tsec h2{font-family:var(--ff-title);font-size:28px;letter-spacing:4px;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative}
.tsec h2::after{content:'';position:absolute;bottom:-1px;left:0;width:60px;height:2px;background:var(--grad)}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.ac{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:all .4s}
.ac:hover{border-color:rgba(232,67,147,.3);transform:translateY(-4px)}
.aav{width:100%;height:400px;background:linear-gradient(135deg,#150a18,#2a1238);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.aav img{width:100%;height:100%;object-fit:cover;object-position:top;position:absolute;inset:0}
.aav .ph{font-size:72px;opacity:.25}
.ainf{padding:20px}
.ainf h4{font-family:var(--ff-title);font-size:22px;letter-spacing:2px;margin-bottom:4px}
.arl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.aco{font-size:14px;color:var(--muted);line-height:1.6}
/* Founder */
.fdr{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:grid;grid-template-columns:340px 1fr;margin-bottom:48px;position:relative;transition:all .4s}
.fdr::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.fdr:hover{border-color:rgba(232,67,147,.3)}
.fdr-img{height:100%;min-height:480px;background:linear-gradient(135deg,#150a18,#2a1238);position:relative;overflow:hidden}
.fdr-img img{width:100%;height:100%;object-fit:cover;object-position:top;position:absolute;inset:0}
.fdr-img .ph{font-size:100px;opacity:.2;display:flex;align-items:center;justify-content:center;height:100%}
.fdr-body{padding:40px 48px;display:flex;flex-direction:column;justify-content:center}
.fdr-body h3{font-family:var(--ff-title);font-size:36px;letter-spacing:4px;margin-bottom:4px;line-height:1.1}
.fdr-role{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}
.fdr-bio{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:20px}
.fdr-quote{font-size:18px;font-style:italic;color:var(--text);border-left:3px solid var(--accent);padding-left:20px;margin:20px 0;line-height:1.5}
.fdr-contact{font-size:14px;color:var(--accent);margin-top:8px}
@media(max-width:900px){.fdr{grid-template-columns:1fr}.fdr-img{min-height:400px}.fdr-body{padding:28px}}
/* Rules */
.rcard{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:32px;margin-bottom:16px;position:relative;transition:all .3s}
.rcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);border-radius:2px}
.rcard:hover{border-color:rgba(232,67,147,.2)}
.rcard h3{font-family:var(--ff-title);font-size:22px;letter-spacing:2px;margin-bottom:10px;color:var(--accent)}
.rcard p{color:var(--muted);font-size:15px;line-height:1.7}
/* Trophies */
.trophy-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px}
.tgrid{display:flex;flex-direction:column;gap:20px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:0;transition:all .3s;position:relative}
.tcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.tcard.tp-1::before{background:linear-gradient(180deg,#ffd700,#ffaa00)}.tcard.tp-2::before{background:linear-gradient(180deg,#c0c0c0,#999)}.tcard.tp-3::before{background:linear-gradient(180deg,#cd7f32,#a0522d)}.tcard.tp-other::before{background:var(--grad)}
.tcard:hover{border-color:rgba(232,67,147,.2);transform:translateX(4px)}
.tplace{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border-right:1px solid var(--border)}
.tplace-icon{font-size:36px;line-height:1}
.tplace-num{font-family:var(--ff-head);font-size:14px;font-weight:900;margin-top:4px;letter-spacing:2px}
.tp-1 .tplace-num{color:#ffd700}.tp-2 .tplace-num{color:#c0c0c0}.tp-3 .tplace-num{color:#cd7f32}.tp-other .tplace-num{color:var(--accent)}
.tbody{padding:20px 28px;min-width:0}
.tbody h3{font-family:var(--ff-title);font-size:24px;letter-spacing:2px;margin-bottom:4px;line-height:1.2}
.tbody .tt-game{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.tbody .tt-date{font-size:13px;color:var(--muted);letter-spacing:1px}
.tbody .tt-desc{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5}
.tprize{padding:20px 28px;text-align:right;flex-shrink:0}
.tprize .pv{font-family:var(--ff-head);font-size:20px;font-weight:700;color:#00c896;letter-spacing:1px}
.tprize .pl{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
@media(max-width:900px){.tcard{grid-template-columns:80px 1fr}.tprize{grid-column:1/-1;text-align:left;padding:0 28px 16px;border-top:1px solid var(--border);padding-top:12px}.trophy-stats{grid-template-columns:1fr}}
/* Bundesliga */
.bl-intro{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:32px;margin-bottom:40px;position:relative;overflow:hidden;font-size:16px;color:var(--muted);line-height:1.7}
.bl-intro::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.blg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.blc{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:all .4s}
.blc:hover{border-color:rgba(232,67,147,.3);transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.blc-img{width:100%;height:400px;background:linear-gradient(135deg,#150a18,#2a1238);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.blc-img img{width:100%;height:100%;object-fit:cover;object-position:top;position:absolute;inset:0}
.blc-img .ph{font-size:72px;opacity:.2}

/* Login modal */

/* Saving indicator */

.toast{position:fixed;bottom:32px;right:32px;padding:14px 28px;border-radius:4px;font-weight:700;font-size:14px;letter-spacing:1px;z-index:10000;animation:tin .4s ease-out;box-shadow:0 8px 32px rgba(0,0,0,.3)}

@media(max-width:900px){.feat{grid-template-columns:1fr}.ng{grid-template-columns:1fr}.mr{grid-template-columns:1fr;gap:12px}.sr{grid-template-columns:repeat(2,1fr)}.hi{padding:0 20px}.main{padding:24px 20px 60px}nav button{padding:8px 12px;font-size:12px}.fr,.fr3{grid-template-columns:1fr}.mu{flex-direction:column;gap:20px!important}}

<body>
<div id="app"><div class="loading" style="margin-top:90px">LOADING...</div></div>
<script>
// =============================================
//  CONFIG — Change your admin password here
// =============================================
const ADMIN_PASSWORD = 'KimKorp2026!';
// =============================================

let D={news:[],matches:[],admins:[],squads:[],sponsors:[],founder:{name:'',title:'',bio:'',contact:'',image:'',quote:''},rules:[],recruiters:[],warmanagers:[],trophies:[],bundesliga:{intro:'',members:[]}};
let page='news',mdet=null,adm=false,editing=null,fs={},saving=false,ghToken=localStorage.getItem('kk_gh_token')||'',ghRepo=localStorage.getItem('kk_gh_repo')||'',showLogin=false,siteAuth=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function csv(s){return(s||'').split(',').map(x=>x.trim()).filter(Boolean)}
function toast(m,ok=true){const e=document.createElement('div');e.className='toast '+(ok?'toast-ok':'toast-err');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function img2b64(file){return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(file)})}
function tc(t){return'ntg-'+t}
function trc(t){return t==='Diamond'?'td':t==='Gold'?'tg':'ts2'}

function LOGO_SVG(mode){
  if(mode==='hero')return `<img src="logo.png" alt="Kim Korp" style="width:240px;height:240px;margin:0 auto 20px;display:block;filter:drop-shadow(0 0 30px rgba(232,67,147,0.6));animation:heroIn 1s ease-out;object-fit:contain">`;
  return `<img src="logo.png" alt="Kim Korp" class="clan-logo">`;
}

// ========== DATA LOADING ==========
async function loadData(){
  try{
    const r=await fetch('data.json?t='+Date.now());
    if(r.ok){D=await r.json()}
  }catch(e){toast('Could not load data.json',false)}
  // Ensure all fields exist for backwards compatibility
  D.news=D.news||[];D.matches=D.matches||[];D.admins=D.admins||[];
  D.squads=D.squads||[];D.sponsors=D.sponsors||[];D.founder=D.founder||{};
  D.rules=D.rules||[];D.recruiters=D.recruiters||[];D.warmanagers=D.warmanagers||[];D.trophies=D.trophies||[];D.bundesliga=D.bundesliga||{};D.bundesliga.intro=D.bundesliga.intro||'';D.bundesliga.members=D.bundesliga.members||[];D.bundesliga.standings=D.bundesliga.standings||[];
}

// ========== GITHUB SAVE ==========
async function saveToGitHub(){
  if(!ghToken||!ghRepo){toast('GitHub not configured!',false);return}
  saving=true;render();
  try{
    // Get current file SHA
    const getR=await fetch(`https://api.github.com/repos/${ghRepo}/contents/data.json`,{headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'}});
    let sha='';
    if(getR.ok){const gd=await getR.json();sha=gd.sha}
    // Update file
    const body={message:'Update site data',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2)))),branch:'main'};
    if(sha)body.sha=sha;
    const putR=await fetch(`https://api.github.com/repos/${ghRepo}/contents/data.json`,{method:'PUT',headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(putR.ok){toast('Saved & pushed to GitHub!')}
    else{const err=await putR.json();toast('GitHub error: '+(err.message||putR.status),false)}
  }catch(e){toast('Save failed: '+e.message,false)}
  saving=false;render();
}

// ========== RENDER ==========
function render(){
  if(!siteAuth){document.getElementById('app').innerHTML=renderGate();bindGate();return}
  document.getElementById('app').innerHTML=
    renderHeader()
    +((page==='news'||page==='wars')&&!mdet?renderHero():'')
    +(saving?'<div class="saving-bar"></div>':'')
    +'<div class="main">'+renderPage()+'</div>'
    +renderFooter()
    +(showLogin?renderLoginModal():'');
  bindAll();
  // Adjust top offset to match actual header height
  const hdr=document.querySelector('header');
  if(hdr){const h=hdr.offsetHeight+'px';document.querySelectorAll('.hero,.pt,[data-back],.loading').forEach(el=>{if(el.style.marginTop)el.style.marginTop=h;if(el.classList.contains('hero'))el.style.marginTop=h})}
}

function renderGate(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f">
    <div class="modal" style="position:relative;box-shadow:0 0 60px rgba(255,255,255,.03);border-color:rgba(255,255,255,.08)">
      <div style="font-size:48px;margin-bottom:16px;opacity:.4">🔒</div>
      <h2 style="font-size:20px;-webkit-text-fill-color:var(--muted);color:var(--muted);letter-spacing:3px">Private Page</h2>
      <p style="letter-spacing:1px;margin-bottom:24px;opacity:.5">This content is password protected.</p>
      <input type="password" id="gpw" placeholder="Password..." autocomplete="off">
      <div class="err" id="gErr"></div>
      <div style="margin-top:16px"><button class="mbtn mbtn-go" id="gLogin" style="background:rgba(255,255,255,.1);color:var(--muted)">Enter</button></div>
    </div></div>`;
}

function bindGate(){
  const pw=document.getElementById('gpw'),btn=document.getElementById('gLogin');
  if(pw){pw.focus();pw.onkeydown=e=>{if(e.key==='Enter')btn?.click()}}
  if(btn)btn.onclick=()=>{
    if(pw.value===ADMIN_PASSWORD){siteAuth=true;sessionStorage.setItem('kk_auth','1');document.title='KIM KORP — Esports';render()}
    else{document.getElementById('gErr').textContent='Wrong password!';pw.value='';pw.focus()}
  };
}

function renderHeader(){
  const ps=[{id:'news',l:'News'},{id:'wars',l:'Wars'},{id:'trophies',l:'Trophies'},{id:'bundesliga',l:'Bundesliga'},{id:'contact',l:'Team'},{id:'rules',l:'Rules'},{id:'sponsors',l:'Partners'},{id:'recruit',l:'Recruit'},{id:'challenge',l:'Challenge'},{id:'support',l:'Support'}];
  return `<header><div class="hi"><div style="display:flex;align-items:center"><div class="logo" data-nav="news">KIM KORP</div>${LOGO_SVG('lg')}</div><nav>${ps.map(p=>`<button class="${page===p.id?'active':''}" data-nav="${p.id}">${p.l}</button>`).join('')}<a href="http://unicornmaster.bplaced.net/" target="_blank" rel="noopener" style="font-family:var(--ff-body);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-decoration:none;transition:color .3s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">Forum</a><button class="atgl ${adm?'on':''}" data-adm>${adm?'🔓 ADMIN ON':'🔒 ADMIN'}</button></nav></div></header>`;
}

  if(adm){ap=ghConfigBar()+`<div class="ap"><div class="apt">Manage War Managers</div><div class="ail">${D.warmanagers.map(w=>`<div class="air"><span class="it">${w.name}</span><span class="im">${w.role}</span><div class="abr"><button class="ab abe" data-ewm="${w.id}">Edit</button><button class="ab abd" data-dwm="${w.id}">Del</button></div></div>`).join('')}</div><button class="ab aba" data-awm>+ Add Manager</button>${editing&&editing.t==='warmanager'?wmForm():''}</div>`}
  return `<div class="pt" style="margin-top:90px">CHALLENGE US</div><div class="ps">Request a war, scrim, or showmatch</div>${ap}
    <div class="cta-box fade-in" style="margin-top:0;margin-bottom:40px"><div style="font-size:64px;margin-bottom:16px">⚔️</div><h3>REQUEST A WAR</h3><p>Think your team can take us on? Contact one of our war managers below to schedule a scrim, clan war, or showmatch. We play Valorant, CS2, and League of Legends.</p></div>
    <div class="tsec"><h2>WAR & PROJECT MANAGEMENT</h2><div class="ag">${D.warmanagers.map(w=>`<div class="ac fade-in"><div class="aav">${w.image?`<img src="${w.image}">`:'<div class="ph">👤</div>'}</div><div class="ainf"><h4>${w.name}</h4><div class="arl">${w.role}</div><div class="aco">${w.desc}<br><span style="color:var(--accent)">✉ ${w.contact}</span></div></div></div>`).join('')}</div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:20px">
    <div class="rcard fade-in"><h3 style="font-size:18px">🎮 Scrims</h3><p>Practice matches for skill testing. Flexible scheduling, any game title.</p></div>
    <div class="rcard fade-in"><h3 style="font-size:18px">⚔️ Clan Wars</h3><p>Official inter-clan competitive matches. Best-of series with map vetoes.</p></div>
    <div class="rcard fade-in"><h3 style="font-size:18px">🏆 Showmatches</h3><p>Exhibition matches, streamed events, and community challenges.</p></div>
    </div>`;
}
function wmForm(){
  const nw=!editing.id;const df={name:'',role:'',desc:'',image:'',contact:''};const d=nw?df:D.warmanagers.find(w=>w.id===editing.id);if(!d)return '';
  return `<div class="af" id="wmf"><h3 style="font-family:var(--ff-title);font-size:20px;letter-spacing:3px;color:var(--accent)">${nw?'ADD MANAGER':'EDIT MANAGER'}</h3>
    <div class="fr"><div class="fg"><label>Name</label><input id="fwmn" value="${esc(d.name)}"></div><div class="fg"><label>Role</label><input id="fwmr" value="${esc(d.role)}"></div></div>
    <div class="fr"><div class="fg"><label>Email</label><input id="fwmc" value="${esc(d.contact)}"></div><div class="fg"><label>Description</label><input id="fwmd" value="${esc(d.desc)}"></div></div>

}

function ghConfigBar(){
  const ok=ghToken&&ghRepo;
  return `<div style="background:${ok?'rgba(0,200,150,.05)':'rgba(255,68,68,.05)'};border:1px solid ${ok?'rgba(0,200,150,.2)':'rgba(255,68,68,.2)'};border-radius:4px;padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">

function renderFooter(){return `<footer><div class="fl">KIM KORP</div><div class="soc"><a href="#">Twitter</a><a href="#">Instagram</a><a href="#">TikTok</a><a href="#">Twitch</a><a href="#">Discord</a></div><div>© 2026 Kim Korp Esports</div></footer>`}

// ========== EVENTS ==========
function v(id){const e=document.getElementById(id);return e?e.value:''}
function syncMaps(){if(!fs.maps)fs.maps=[];document.querySelectorAll('[data-mn]').forEach(e=>{const i=+e.dataset.mn;if(fs.maps[i])fs.maps[i].name=e.value});document.querySelectorAll('[data-mo]').forEach(e=>{const i=+e.dataset.mo;if(fs.maps[i])fs.maps[i].our=+e.value||0});document.querySelectorAll('[data-mt2]').forEach(e=>{const i=+e.dataset.mt2;if(fs.maps[i])fs.maps[i].their=+e.value||0})}
function syncMem(){if(!fs.mem)fs.mem=[];document.querySelectorAll('[data-sn]').forEach(e=>{const i=+e.dataset.sn;if(fs.mem[i])fs.mem[i].name=e.value});document.querySelectorAll('[data-srl]').forEach(e=>{const i=+e.dataset.srl;if(fs.mem[i])fs.mem[i].role=e.value})}
function imgBind(areaId,fileId){const a=document.getElementById(areaId),f=document.getElementById(fileId);if(a&&f){a.onclick=()=>f.click();f.onchange=async()=>{if(f.files[0]){const b=await img2b64(f.files[0]);a.innerHTML='Click to upload<br><img src="'+b+'">'}}}}

function bindAll(){
  // Nav
  document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{page=e.dataset.nav;mdet=null;editing=null;fs={};render();scrollTo({top:0,behavior:'smooth'})});
  // Admin toggle
  document.querySelectorAll('[data-adm]').forEach(e=>e.onclick=()=>{if(!adm){showLogin=true;render()}else{adm=false;editing=null;fs={};render()}});
  // Match click
  document.querySelectorAll('[data-mm]').forEach(e=>e.onclick=()=>{mdet=e.dataset.mm;render();scrollTo({top:0,behavior:'smooth'})});
  // Back
  document.querySelectorAll('[data-back]').forEach(e=>e.onclick=()=>{mdet=null;render();scrollTo({top:0,behavior:'smooth'})});
  // Filters
  document.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fb').forEach(x=>x.classList.remove('act'));b.classList.add('act');const f=b.dataset.fi;document.querySelectorAll('.mr').forEach(r=>{const g=r.dataset.mg,re=r.dataset.mre;r.style.display=f==='all'?'':(f==='win'||f==='loss'||f==='draw')?re===f?'':'none':g===f?'':'none'})});
  // Cancel form
  document.querySelectorAll('[data-cf]').forEach(e=>e.onclick=()=>{editing=null;fs={};render()});

  // Login modal
  document.querySelectorAll('[data-closem]').forEach(e=>e.onclick=()=>{showLogin=false;render()});
  document.querySelectorAll('[data-closem2]').forEach(e=>e.onclick=()=>{showLogin=false;render()});
  const pwField=document.getElementById('pw');
  if(pwField){
    pwField.focus();
    pwField.onkeydown=(e)=>{if(e.key==='Enter')document.querySelector('[data-login]')?.click()};
    pwField.oninput=()=>{const ok=pwField.value===ADMIN_PASSWORD;document.getElementById('ghFields').style.display=ok?'block':'none'}
  }
  document.querySelectorAll('[data-login]').forEach(e=>e.onclick=()=>{
    const pw=v('pw');
    if(pw!==ADMIN_PASSWORD){document.getElementById('lErr').textContent='Wrong password!';return}
    const repo=v('ghR'),token=v('ghT');
    if(repo){ghRepo=repo;localStorage.setItem('kk_gh_repo',repo)}
    if(token){ghToken=token;localStorage.setItem('kk_gh_token',token)}

  });
  // GitHub config from bar
  document.querySelectorAll('[data-ghcfg]').forEach(e=>e.onclick=()=>{showLogin=true;render();const p=document.getElementById('pw');if(p){p.value=ADMIN_PASSWORD;document.getElementById('ghFields').style.display='block'}});

  // === NEWS CRUD ===

  document.querySelectorAll('[data-dn]').forEach(e=>e.onclick=async()=>{if(confirm('Delete this post?')){D.news=D.news.filter(n=>n.id!==e.dataset.dn);await saveToGitHub();render()}});
  document.querySelectorAll('[data-sn]').forEach(e=>e.onclick=async()=>{

  document.querySelectorAll('[data-src]').forEach(e=>e.onclick=async()=>{
    const id=e.dataset.src,nw=id==='new';
    const obj={id:nw?uid():id,name:v('frcn'),role:v('frcr'),contact:v('frcc'),desc:v('frcd'),image:''};
    const fi=document.getElementById('rcif');
    if(fi?.files[0])obj.image=await img2b64(fi.files[0]);
    else{const ex=D.recruiters.find(r=>r.id===id);if(ex)obj.image=ex.image}
    if(nw)D.recruiters.push(obj);else{const i=D.recruiters.findIndex(r=>r.id===id);if(i>=0)D.recruiters[i]=obj}
    editing=null;fs={};await saveToGitHub();render();
  });
  imgBind('rciu','rcif');

  // === WAR MANAGER CRUD ===
  document.querySelectorAll('[data-awm]').forEach(e=>e.onclick=()=>{editing={t:'warmanager',id:null};fs={};render();document.getElementById('wmf')?.scrollIntoView({behavior:'smooth'})});
  document.querySelectorAll('[data-ewm]').forEach(e=>e.onclick=()=>{editing={t:'warmanager',id:e.dataset.ewm};fs={};render();document.getElementById('wmf')?.scrollIntoView({behavior:'smooth'})});
  document.querySelectorAll('[data-dwm]').forEach(e=>e.onclick=async()=>{if(confirm('Delete?')){D.warmanagers=D.warmanagers.filter(w=>w.id!==e.dataset.dwm);await saveToGitHub();render()}});
  document.querySelectorAll('[data-swm]').forEach(e=>e.onclick=async()=>{
    const id=e.dataset.swm,nw=id==='new';
    const obj={id:nw?uid():id,name:v('fwmn'),role:v('fwmr'),contact:v('fwmc'),desc:v('fwmd'),image:''};
    const fi=document.getElementById('wmif');
    if(fi?.files[0])obj.image=await img2b64(fi.files[0]);
    else{const ex=D.warmanagers.find(w=>w.id===id);if(ex)obj.image=ex.image}
    if(nw)D.warmanagers.push(obj);else{const i=D.warmanagers.findIndex(w=>w.id===id);if(i>=0)D.warmanagers[i]=obj}
    editing=null;fs={};await saveToGitHub();render();
  });
  imgBind('wmiu','wmif');
}

// ========== INIT ==========
(async()=>{if(sessionStorage.getItem('kk_auth')==='1'){siteAuth=true;document.title='KIM KORP — Esports'}await loadData();render()})();
</script>
